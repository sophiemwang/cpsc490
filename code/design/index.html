<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Reviews Analysis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider/dist/nouislider.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nouislider/dist/nouislider.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Restaurant Review Word Frequency Analysis</h1>
        
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5>Controls</h5>
                    </div>
                    <div class="card-body">
                        <form id="analysis-form">
                            <div class="mb-3">
                                <label for="restaurant-selector" class="form-label">Restaurant</label>
                                <select class="form-select" id="restaurant-selector" required>
                                    <option value="" selected disabled>Select a restaurant</option>
                                </select>
                            </div>
                            
                            <div class="card mb-3">
                                <div class="card-header" style="background-color: #e6f3ff; border-left: 5px solid #1f77b4;">
                                    <h6><span style="display: inline-block; width: 12px; height: 12px; background-color: #1f77b4; border-radius: 50%; margin-right: 8px;"></span>Time Range 1</h6>
                                </div>
                                <div class="card-body">
                                    <div class="mb-3">
                                        <label class="form-label">Date Range</label>
                                        <div id="date-range-slider-1"></div>
                                        <div class="d-flex justify-content-between mt-2">
                                            <span id="date-range-min-1"></span>
                                            <span id="date-range-max-1"></span>
                                        </div>
                                        <input type="hidden" id="start-date-1">
                                        <input type="hidden" id="end-date-1">
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">Sentiment Filter</label>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="sentiment-positive-1" value="positive" checked>
                                            <label class="form-check-label" for="sentiment-positive-1">Positive</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="sentiment-neutral-1" value="neutral" checked>
                                            <label class="form-check-label" for="sentiment-neutral-1">Neutral</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="sentiment-negative-1" value="negative" checked>
                                            <label class="form-check-label" for="sentiment-negative-1">Negative</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="card mb-3">
                                <div class="card-header" style="background-color: #fff8e6; border-left: 5px solid #ff7f0e;">
                                    <h6><span style="display: inline-block; width: 12px; height: 12px; background-color: #ff7f0e; border-radius: 50%; margin-right: 8px;"></span>Time Range 2</h6>
                                </div>
                                <div class="card-body">
                                    <div class="mb-3">
                                        <label class="form-label">Date Range</label>
                                        <div id="date-range-slider-2"></div>
                                        <div class="d-flex justify-content-between mt-2">
                                            <span id="date-range-min-2"></span>
                                            <span id="date-range-max-2"></span>
                                        </div>
                                        <input type="hidden" id="start-date-2">
                                        <input type="hidden" id="end-date-2">
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">Sentiment Filter</label>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="sentiment-positive-2" value="positive" checked>
                                            <label class="form-check-label" for="sentiment-positive-2">Positive</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="sentiment-neutral-2" value="neutral" checked>
                                            <label class="form-check-label" for="sentiment-neutral-2">Neutral</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="sentiment-negative-2" value="negative" checked>
                                            <label class="form-check-label" for="sentiment-negative-2">Negative</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="top-n" class="form-label">Top Words</label>
                                <input type="number" class="form-control" id="top-n" min="10" max="200" value="50">
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100">Generate Chart</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5>Category Summary</h5>
                    </div>
                    <div class="card-body">
                        <div id="summary-chart" class="d-flex justify-content-center align-items-center">
                            <div id="category-summary-chart"></div>
                        </div>
                    </div>
                </div>
                
                <div class="card mt-4">
                    <div class="card-header">
                        <h5>Word Frequency Lollipop Chart</h5>
                    </div>
                    <div class="card-body">
                        <div id="chart-container" class="d-flex justify-content-center align-items-center">
                            <div id="lollipop-chart"></div>
                            <div id="loading" class="d-none">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                            <div id="no-data-message" class="text-center text-muted">
                                Select a restaurant and click "Generate Chart" to visualize review data
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
